<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download - Post MyClinica Ultra HD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      color: white;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .preview-container {
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 4px solid #1e293b;
      background: white;
      margin-bottom: 32px;
      transition: transform 0.3s ease;
    }

    .preview-container:hover {
      transform: translateY(-5px);
    }

    .preview-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(90deg, #52e0c4 0%, #0d9488 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 18px;
      padding: 18px 40px;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.5);
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px -5px rgba(13, 148, 136, 0.6);
    }
    
    .download-btn svg {
      width: 24px;
      height: 24px;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Arte Final: Post MyClinica</h1>
    <p class="subtitle">A imagem está renderizada em 1080x1080 (resolução máxima, sem perda de qualidade).</p>

    <!-- Preview da Imagem Gerada Pelo Script -->
    <div class="preview-container">
      <img src="/myclinica_hd_exact_post.png" alt="Post Ultra HD MyClinica">
    </div>

    <!-- Botão de Download -->
    <a href="/myclinica_hd_exact_post.png" download="post-myclinica-hd.png" class="download-btn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
      Baixar Post em Alta Qualidade (PNG)
    </a>
  </div>

</body>
</html>
